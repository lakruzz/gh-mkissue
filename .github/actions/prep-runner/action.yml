name: Prep-runner
description: Sets the GitHub workflow to do what we need

runs:
  using: composite
  steps:
    # Set up Go
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"
        cache: true

    # Install Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: install gh-insitu
      shell: bash
      run: |
        gh ext install devx-cafe/gh-insitu || true
        gh insitu run prep-runner

