# .insitu.yml - minimal TakT-ready setup

defaults:
  die-on-error: true
  timeout: 5m
  verbose: false

inventory:
  - id: gh-auth
    name: GitHub Authentication
    command: gh auth status

  - id: install-gh-insitu
    name: Install gh-insitu
    command: gh insitu --help >/dev/null 2>&1 || gh extension install devx-cafe/gh-insitu

  - id: install-gh-tt
    name: Install gh-tt
    command: gh extension install devx-cafe/gh-tt

  - id: install-takt-shortcuts
    name: Install TakT shortcuts
    command: |
      gh alias set workon '!gh tt workon "$@"' --clobber
      gh alias set wrapup '!gh tt wrapup "$@"' --clobber
      gh alias set deliver '!gh tt deliver "$@"' --clobber
      gh alias set semver '!gh tt semver "$@"' --clobber

  - id: safe-repo
    name: Mark repository as safe for git operations
    command: git config --global --add safe.directory "$(pwd)"

  - id: repo-gitconfig
    name: Use repo-root .gitconfig for consistent git settings
    command: |
      git config --local --get include.path | grep -e ../.gitconfig >/dev/null 2>&1 || \
      git config --local --add include.path ../.gitconfig

  - id: cspell
    name: Run cspell
    command: cspell

  - id: go-mod-download
    name: Install Go dependencies
    command: go mod download

  - id: install-golangci-lint
    name: Install golangci-lint
    command: |
      set -eu
      go_bin="$(go env GOPATH)/bin"
      version="$(gh api repos/golangci/golangci-lint/releases/latest --jq .tag_name)"
      case "$(uname -s)-$(uname -m)" in
        Linux-x86_64) platform=linux-amd64 ;;
        Linux-aarch64) platform=linux-arm64 ;;
        *) printf 'Unsupported platform: %s-%s\n' "$(uname -s)" "$(uname -m)" >&2; exit 1 ;;
      esac
      name="golangci-lint-${version#v}-${platform}"
      archive="${name}.tar.gz"
      release_url="https://github.com/golangci/golangci-lint/releases/download/$version"
      work_dir="$(mktemp -d)"
      trap 'rm -rf "$work_dir"' EXIT
      cd "$work_dir"
      curl -fsSLo "$archive" "$release_url/$archive"
      curl -fsSLo checksums.txt "$release_url/golangci-lint-${version#v}-checksums.txt"
      awk -v archive="$archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' checksums.txt > checksum.txt
      sha256sum -c checksum.txt
      tar -xzf "$archive"
      mkdir -p "$go_bin"
      install -m 755 "$name/golangci-lint" "$go_bin/golangci-lint"
      "$go_bin/golangci-lint" version
      if [ -n "${GITHUB_PATH:-}" ]; then
        printf '%s\n' "$go_bin" >> "$GITHUB_PATH"
      fi

  - id: markdownlint
    name: Run markdownlint
    command: markdownlint-cli2

  - id: prettier
    name: Run prettier
    command: prettier --check .

  - id: "install-npm-tools"
    name: "Install npm tools"
    command: |
      npm install -g prettier@3.10.1 markdownlint-cli2@0.24.1 cspell@10.5.1 @cspell/dict-da-dk@4.1.3 @mindovermachine-dev/remote-astro-theme@0.1.0
      command -v cspell
      command -v markdownlint-cli2
      command -v prettier
      command -v remote-astro-theme

  - id: runner-install-npm-tools
    name: Install runner npm tools
    command: |
      set -eu
      if npm list -g --depth=0 --json | jq -e '
        .dependencies.prettier.version == "3.10.1" and
        .dependencies["markdownlint-cli2"].version == "0.24.1" and
        .dependencies.cspell.version == "10.5.1" and
        .dependencies["@cspell/dict-da-dk"].version == "4.1.3"
      ' >/dev/null; then
        printf 'Runner npm tools already installed\n'
      else
        npm install -g prettier@3.10.1 markdownlint-cli2@0.24.1 cspell@10.5.1 @cspell/dict-da-dk@4.1.3
      fi
      command -v cspell
      command -v markdownlint-cli2
      command -v prettier

  - id: verify-npm-tools
    name: Verify linting tools are available
    command: |
      command -v cspell
      command -v markdownlint-cli2
      command -v prettier
      command -v remote-astro-theme

  - id: "fix-markdown"
    name: "Fix all fixable markdown issues"
    command: |
      markdownlint-cli2 --fix

  - id: "fix-prettier"
    name: "Fix all fixable prettier issues"
    command: |
      prettier --write .

waves:
  - id: post-create
    name: Dev Container Post Create
    parallel: true
    checks:
      - gh-auth
      - install-npm-tools
      - install-gh-insitu
      - install-gh-tt
      - install-takt-shortcuts
      - safe-repo
      - repo-gitconfig
      - go-mod-download
      - install-golangci-lint

  - id: "prep-runner"
    name: "Run to prepare GitHub runner"
    parallel: true
    checks:
      - gh-auth
      - install-gh-insitu
      - repo-gitconfig
      - runner-install-npm-tools
      - go-mod-download
      - install-golangci-lint

  - id: trunk-worthy
    name: Minimum quality checks before commit
    parallel: true
    checks:
      - cspell
      - markdownlint
      - prettier

  - id: "fix-all"
    name: "Fix anything that can be fixed automatically"
    parallel: true
    checks:
      - "fix-markdown"
      - "fix-prettier"
      - "cspell"
